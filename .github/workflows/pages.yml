# Publish the repository to GitHub Pages on every push to main.
#
# The site is the repository as it is, minus the tests and the tool folders:
# the landing page at the root, the four interactive pages under
# visualization/, the schema figure, and every data file and table.
#
# This needs the repository's Pages source set to "GitHub Actions"
# (Settings, Pages, Build and deployment, Source). Until that is set, the
# deploy step fails with a message that says Pages is not enabled.

name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Gather the files to publish
        run: |
          mkdir -p _site
          rsync -a --exclude .git --exclude .github --exclude .claude --exclude tests --exclude _site ./ _site/
          touch _site/.nojekyll
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
